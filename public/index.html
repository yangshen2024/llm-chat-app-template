<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Chat · AI 工作空间</title><link rel="stylesheet" href="styles.css"></head>
<body><button id="backdrop" aria-label="关闭侧边栏"></button><aside id="sidebar"><div class="brand"><span class="logo">✳</span><button id="collapse" aria-label="收起侧边栏" title="收起侧边栏">◧</button></div><nav><button id="new-chat">✎ <span>新建对话</span><kbd>⌘ K</kbd></button><button id="search-chat">⌕ <span>搜索对话</span></button><button id="explore">▦ <span>探索灵感</span></button></nav><div class="history-label">你的对话</div><div id="history"></div><button id="settings" class="profile"><span class="avatar">Y</span><span>我的工作空间<small>本地个人账户</small></span><span>⋯</span></button></aside>
<main><header><button id="expand" aria-label="展开侧边栏">◧</button><label class="model-label">Chat <select id="model" aria-label="选择模型"><option value="@cf/meta/llama-3.3-70b-instruct-fp8-fast">Llama 3.3</option><option value="demo">离线演示</option></select></label><span id="mode-badge">Workers AI</span><button id="theme" aria-label="切换主题" title="切换明暗主题">◐</button></header><div id="conversation"><section id="welcome"><div class="welcome-mark">✳</div><h1>今天有什么可以帮你？</h1><p>从一个问题开始，让想法更进一步。</p><div id="suggestions"></div></section><div id="chat-messages" aria-label="对话消息"></div></div><div class="composer-area"><div id="status" role="status" aria-live="polite"></div><form id="composer"><textarea id="user-input" aria-label="输入消息" placeholder="询问任何问题" rows="1" maxlength="16000"></textarea><div class="composer-tools"><span>✧ <span id="composer-mode">与 Llama 3.3 对话</span></span><button id="send-button" type="submit" aria-label="发送消息" disabled>↑</button><button id="stop-button" type="button" aria-label="停止生成" hidden>■</button></div></form><footer>AI 也可能会犯错，请核查重要信息。此项目为独立界面，非 ChatGPT 官方产品。</footer></div></main>
<dialog id="panel"><div class="dialog-heading"><h2 id="panel-title"></h2><button id="close-panel" aria-label="关闭弹窗">×</button></div><div id="panel-body"></div></dialog><script type="module" src="chat.js"></script></body></html>
